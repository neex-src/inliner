# The Gradle daemon JDK (17+) comes from JAVA_HOME / PATH. The JDK 25 toolchain the tests run on
# is found among the installed JDKs or fetched by the foojay resolver (settings.gradle.kts).
org.gradle.jvmargs=-Xmx2g
kotlin.stdlib.default.dependency=false
# Compile inside the Gradle daemon: a separate Kotlin daemon writes its logs and markers to /tmp.
kotlin.compiler.execution.strategy=in-process
# Not here, by design: -PijdevPlugin=<dir of the REPL plugin's Gradle build> (given by `bb ijdev`,
# without it there is no runIdeDev task) and -PlocalIde=<an installed IDE> for verifyPlugin (a
# path of your machine: ~/.gradle/gradle.properties).
