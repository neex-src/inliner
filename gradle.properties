# Daemon on 17; the platform plugin wants a Java 25 toolchain to match the IDE's JBR,
# which lives inside the Toolbox install — register it so toolchain detection finds it.
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk
org.gradle.java.installations.paths=~/.local/share/JetBrains/Toolbox/apps/intellij-idea-ultimate/jbr
org.gradle.jvmargs=-Xmx2g
kotlin.stdlib.default.dependency=false
# The ijdev REPL plugin's Gradle build (repls repo); runIdeDev loads its zip and agent jar.
ijdevPlugin=~/projects/sandbox/run/claude~/repls/ijdev/plugin
# Compile inside the Gradle daemon: a separate Kotlin daemon writes its logs and markers to /tmp.
kotlin.compiler.execution.strategy=in-process
